input:
  image_dir: "A/img"          # 輸入圖像目錄，包含需要進行數據增強的原始圖像
  label_dir: "A/label"        # 輸入標籤目錄，對應於輸入圖像的標籤文件
  
output:
  image_dir: "output/images"  # 增強後圖像的輸出目錄
  label_dir: "output/labels"  # 增強後標籤文件的輸出目錄
  
augmentation:
  num_images: 100             # 每張圖像生成 100 個增強版本，適合數據量較少的情況；如果數據量大，可以適當減少此數量
  num_operations: [3, 5]      # 每次增強時隨機應用 3 到 5 個操作，增加增強的多樣性，同時避免過度增強

  operations:
    flip:
      probability: 0          # 水平翻轉的概率為 0%，適合目標方向敏感的任務
    rotate:
      angle: [-180, 180]      # 隨機旋轉角度範圍為 -180 到 180 度，用以模擬不同角度的拍攝情境
    multiply:
      range: [0.8, 1.2]       # 亮度增強的範圍，將亮度調整到 0.8 倍至 1.2 倍，用於模擬不同光照條件
    scale:
      range: [0.8, 1.2]       # 縮放範圍，將圖像縮小至 0.8 倍或放大至 1.2 倍，適用於模擬目標尺寸的變化
    contrast:
      range: [0.9, 1.1]       # 對比度調整範圍，用於模擬不同清晰度的場景，提高模型對不同對比度的適應性
    hue:
      range: [-1, 1]          # 色調調整範圍為 -1 到 1，用於模擬不同色彩環境下的場景
    noise:
      scale: [0, 0.05]        # 高斯噪聲範圍，用於增強抗噪聲能力，模擬輕微的圖像干擾
    perspective:
      scale: [0.01, 0.05]     # 透視變換的範圍，增加輕微的視角變化，模擬不同拍攝角度
    blur:
      kernel: [3, 5]          # 模糊核大小範圍為 3 到 5，用於模擬不同清晰度的圖像，提升模型的魯棒性
  
processing:
  num_workers: 2              # 設置多線程數量，用於加速處理
                              # 建議範圍：1 到 CPU 核心數量的 2 倍之間
                              # 若有多核 CPU，設置為核心數的一半至核心數的兩倍（如 4 核可設置為 2 到 8），以平衡速度和資源使用
                              # 注意：過高的 num_workers 可能導致內存佔用過大，使系統不穩定
